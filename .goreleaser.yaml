# goreleaser config — runs in CI on tag push (see .github/workflows/release.yml).
version: 2

builds:
  - id: age-plugin-sshagent
    main: .
    binary: age-plugin-sshagent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - freebsd
      - openbsd
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # OpenBSD is the lowest-priority target — amd64 only.
      - goos: openbsd
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "age-plugin-sshagent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  filters:
    exclude:
      - "^Merge "

release:
  draft: false
  prerelease: auto
